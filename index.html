<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wochenplaner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Wochenplaner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevWeek" aria-label="Vorherige Woche">‹</button>
    <button class="week-label" id="weekLabel" aria-label="Zur aktuellen Woche"></button>
    <button class="icon-btn" id="nextWeek" aria-label="Nächste Woche">›</button>
  </header>

  <main>
    <!-- Ansicht: Plan -->
    <section id="view-plan" class="view">
      <div class="plan-toolbar">
        <div class="segmented" role="tablist">
          <button data-mode="day" class="active">Tag</button>
          <button data-mode="week">Woche</button>
        </div>
        <button class="text-btn" id="copyWeekBtn">Vorwoche übernehmen</button>
      </div>
      <div class="day-chips" id="dayChips"></div>
      <div class="day-events" id="dayEvents" hidden></div>
      <div class="people-head" id="peopleHead"></div>
      <div class="timeline-wrap" id="timelineWrap">
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="week-grid-wrap" id="weekGridWrap" hidden>
        <div class="week-grid" id="weekGrid"></div>
      </div>
      <button class="fab" id="addBtn" aria-label="Zeitblock hinzufügen">+</button>
    </section>

    <!-- Ansicht: Termine -->
    <section id="view-events" class="view" hidden>
      <div id="eventsContent"></div>
      <button class="fab" id="addEventBtn" aria-label="Termin hinzufügen">+</button>
    </section>

    <!-- Ansicht: Summen -->
    <section id="view-sum" class="view" hidden>
      <div id="sumContent"></div>
    </section>

    <!-- Ansicht: Kategorien & Einstellungen -->
    <section id="view-cat" class="view" hidden>
      <h2>Kategorien</h2>
      <ul class="cat-list" id="catList"></ul>
      <button class="primary-btn" id="addCatBtn">Neue Kategorie</button>
      <h2>Personen</h2>
      <ul class="cat-list" id="personList"></ul>
      <p class="hint" id="storeHint"></p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="plan" class="active"><span class="tab-ic">▦</span>Plan</button>
    <button data-view="events"><span class="tab-ic">★</span>Termine</button>
    <button data-view="sum"><span class="tab-ic">Σ</span>Summen</button>
    <button data-view="cat"><span class="tab-ic">●</span>Kategorien</button>
  </nav>

  <!-- Dialog: Zeitblock -->
  <dialog id="blockDialog">
    <form method="dialog" id="blockForm">
      <h3 id="blockTitle">Zeitblock</h3>
      <label class="field-label">Wer</label>
      <div class="segmented full" id="personPick"></div>
      <label class="field-label">Was</label>
      <div class="cat-pick" id="catPick"></div>
      <div class="row">
        <label class="field">Tag<input type="date" id="fDate" required></label>
      </div>
      <div class="row two">
        <label class="field">Von<input type="time" id="fStart" step="900" required></label>
        <label class="field">Bis<input type="time" id="fEnd" step="900" required></label>
      </div>
      <label class="field">Notiz (optional)<input type="text" id="fNote" maxlength="80" placeholder="z. B. Spätschicht"></label>
      <p class="error" id="blockError"></p>
      <div class="dialog-actions">
        <button type="button" class="danger-btn" id="deleteBlockBtn">Löschen</button>
        <span class="spacer"></span>
        <button type="button" class="text-btn" id="cancelBlockBtn">Abbrechen</button>
        <button type="submit" class="primary-btn" id="saveBlockBtn">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog: Termin -->
  <dialog id="eventDialog">
    <form method="dialog" id="eventForm">
      <h3 id="eventTitle">Termin</h3>
      <label class="field">Was<input type="text" id="eTitle" maxlength="80" required placeholder="z. B. U-Untersuchung Emilia"></label>
      <label class="field-label">Für wen</label>
      <div class="segmented full" id="eventPersonPick"></div>
      <div class="row">
        <label class="field">Tag<input type="date" id="eDate" required></label>
      </div>
      <label class="check"><input type="checkbox" id="eAllDay"> Ganztägig</label>
      <div class="row two" id="eTimes">
        <label class="field">Von<input type="time" id="eStart" step="300"></label>
        <label class="field">Bis (optional)<input type="time" id="eEnd" step="300"></label>
      </div>
      <label class="field">Notiz (optional)<input type="text" id="eNote" maxlength="200" placeholder="z. B. Impfpass mitnehmen"></label>
      <p class="error" id="eventError"></p>
      <div class="dialog-actions">
        <button type="button" class="danger-btn" id="deleteEventBtn">Löschen</button>
        <button type="button" class="text-btn" id="showEventBtn">Im Plan</button>
        <span class="spacer"></span>
        <button type="button" class="text-btn" id="cancelEventBtn">Abbrechen</button>
        <button type="submit" class="primary-btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog: Kategorie -->
  <dialog id="catDialog">
    <form method="dialog" id="catForm">
      <h3 id="catTitle">Kategorie</h3>
      <label class="field">Name<input type="text" id="cName" maxlength="40" required></label>
      <label class="field-label">Farbe</label>
      <div class="swatches" id="swatches"></div>
      <p class="error" id="catError"></p>
      <div class="dialog-actions">
        <button type="button" class="danger-btn" id="deleteCatBtn">Löschen</button>
        <span class="spacer"></span>
        <button type="button" class="text-btn" id="cancelCatBtn">Abbrechen</button>
        <button type="submit" class="primary-btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog: Bestätigung -->
  <dialog id="confirmDialog">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button value="no" class="text-btn">Abbrechen</button>
        <button value="yes" class="primary-btn" id="confirmYes">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Anmeldung (nur mit Supabase) -->
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <img src="icon.svg" alt="" width="64" height="64">
      <h1>Wochenplaner</h1>
      <p id="loginText">Melde dich mit deiner E-Mail an. Du bekommst einen Link, mit dem du direkt eingeloggt wirst.</p>
      <label class="field">E-Mail<input type="email" id="loginEmail" autocomplete="email" required></label>
      <button class="primary-btn" type="submit" id="loginBtn">Anmelde-Link senden</button>
      <p class="hint" id="loginMsg"></p>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
